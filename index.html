mark { background: var(--accent-soft); color: inherit; border-radius: 3px; padding: 0 1px; }
@media (prefers-reduced-motion: reduce) { .toast, .btn, .qt, .tab, .card, .tabs { transition: none; scroll-behavior: auto; } .card:not([open]):hover, .qt:hover { transform: none; } }
@media (max-width: 440px) { .brand .subt { display: none; } .row { grid-template-columns: 1fr; gap: 2px; } .sheet .two { grid-template-columns: 1fr; } }

/* ===== Efeitos inspirados no React Bits (github.com/DavidHDev/react-bits), adaptados para JS puro ===== */
/* SoftAurora: brilho suave que se move no fundo do topo */
header.top { overflow: hidden; isolation: isolate; }
header.top::before { content: ""; position: absolute; inset: -40% -10%; z-index: -1; pointer-events: none;
  background: radial-gradient(40% 60% at 20% 30%, var(--aurora-1), transparent 70%), radial-gradient(35% 55% at 80% 20%, var(--aurora-2), transparent 70%), radial-gradient(45% 50% at 55% 90%, var(--aurora-1), transparent 70%); }
@media (prefers-reduced-motion: no-preference) { header.top::before { animation: aurora 18s ease-in-out infinite alternate; } }
@keyframes aurora { 0% { transform: translate3d(-4%, 0, 0) scale(1); } 50% { transform: translate3d(3%, 4%, 0) scale(1.08); } 100% { transform: translate3d(5%, -3%, 0) scale(1.02); } }

/* ShinyText: reflexo que passa pelo título */
.shiny { background: linear-gradient(110deg, var(--head-ink) 40%, var(--shine) 50%, var(--head-ink) 60%) 0 0 / 250% 100% repeat-x; background-color: var(--head-ink); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
@media (prefers-reduced-motion: no-preference) { .shiny { animation: shine 5.5s ease-in-out infinite; } }
@keyframes shine { 0%, 55% { background-position: 120% 0; } 100% { background-position: -20% 0; } }
.mark { position: relative; overflow: hidden; }
@media (prefers-reduced-motion: no-preference) { .mark::after { content: ""; position: absolute; inset: 0; background: linear-gradient(110deg, transparent 35%, rgba(255,255,255,.7) 50%, transparent 65%) 0 0 / 250% 100% no-repeat; animation: shine 5.5s ease-in-out infinite; mix-blend-mode: soft-light; } }

/* SpotlightCard: luz que segue o mouse nos cartões e atalhos */
.card, .qt { position: relative; }
.card::before, .qt::before { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2; opacity: 0; transition: opacity .3s;
  background: radial-gradient(260px circle at var(--mx, 50%) var(--my, 50%), var(--spot), transparent 65%); }
.card::after, .qt::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2; opacity: 0; transition: opacity .3s; padding: 1px;
  background: radial-gradient(180px circle at var(--mx, 50%) var(--my, 50%), var(--spot-edge), transparent 70%);
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor; mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); }
.lit::before, .lit::after { opacity: 1; }

/* CountUp: números que contam ao carregar */
.n, .count { font-variant-numeric: tabular-nums; }

/* ClickSpark: faíscas ao tocar */
#sparks { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 50; }
.favbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; margin: 0 0 16px; font-size: 0.9rem; color: var(--muted); }
.favbar span { flex: 1 1 260px; }
.favbar .favin { display: flex; gap: 8px; flex: 1 1 260px; }
.favbar input { flex: 1; min-width: 0; font: inherit; font-size: 1rem; padding: 8px 10px; border-radius: var(--r-sm); border: 1px solid var(--line); background: var(--surface-2); color: var(--ink); }
</style>

<header class="top">
  <div class="wrap">
    <div class="brand">
      <div class="mark" aria-hidden="true">156</div>
      <div class="titles"><h1><span class="shiny">Guia 156 Osasco</span></h1><span class="subt">Consulta rápida para o atendimento</span></div>
      <button class="btn small" id="add" type="button" hidden>+ Incluir</button>
    </div>
    <div class="search">
      <input id="q" type="text" inputmode="search" enterkeyhint="search" placeholder="Bairro, assunto, nome ou telefone" autocomplete="off" aria-label="Buscar no guia">
      <button id="clear" type="button" aria-label="Limpar busca" hidden>×</button>
    </div>
    <div class="tabs-wrap" id="tabsWrap"><button class="tab-arrow l" type="button" data-scroll="-1" aria-label="Ver abas anteriores">‹</button><nav class="tabs" id="tabs" aria-label="Categorias"></nav><button class="tab-arrow r" type="button" data-scroll="1" aria-label="Ver mais abas">›</button></div>
  </div>
</header>

<main><div class="wrap" id="list"></div></main>
<footer class="wrap">Cada cartão mostra de onde veio a informação. Itens com aviso amarelo precisam ser confirmados.</footer>
<div id="sheetHost"></div>
<canvas id="sparks" aria-hidden="true"></canvas>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const norm = s => (s || "").toString().normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  const digits = s => (s || "").replace(/\D/g, "");
  const esc = s => (s ?? "").toString().replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const lines = s => (s || "").split("\n").map(x => x.trim()).filter(Boolean);

  // ---------- estado ----------
  let favs = [];
  try { favs = JSON.parse(localStorage.getItem("guia156-favs") || "[]"); } catch (e) {}
  // ---------- banco na nuvem (Supabase) ----------
  const CFG = window.GUIA_CONFIG || {};
  const temNuvem = !!(CFG.url && CFG.chave);
  const ls = { get: k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
               set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} },
               del: k => { try { localStorage.removeItem(k); } catch (e) {} } };
  const api = async (path, opts = {}) => {
    const r = await fetch(CFG.url.replace(/\/$/, "") + "/rest/v1/" + path, { ...opts, headers: { apikey: CFG.chave, "Content-Type": "application/json", ...(opts.headers || {}) } });
    if (!r.ok) { const err = new Error("http " + r.status); err.code = "unavailable"; throw err; }
    return r.status === 204 ? null : r.json();
  };
  const rpc = (fn, body) => api("rpc/" + fn, { method: "POST", body: JSON.stringify(body) });
  const pinSalvo = () => ls.get("guia156-pin");
  const codigoFav = () => ls.get("guia156-codigo");
  const saveFavs = () => {
    ls.set("guia156-favs", JSON.stringify(favs));
    if (temNuvem && codigoFav()) rpc("salvar_favoritos", { p_codigo: codigoFav(), p_ids: favs }).catch(() => {});
  };
  const sincronizarFavs = async codigo => {
    const nuvem = await rpc("ler_favoritos", { p_codigo: codigo });
    const lista = Array.isArray(nuvem) ? nuvem : [];
    const juntos = [...new Set([...lista, ...favs])];
    favs = juntos; ls.set("guia156-favs", JSON.stringify(favs));
    if (juntos.length !== lista.length) { const r = await rpc("salvar_favoritos", { p_codigo: codigo, p_ids: favs }); if (r !== "ok") throw new Error(r); }
  };
  const favBar = () => codigoFav()
    ? `<div class="favbar"><span>☁ Seus favoritos estão salvos na nuvem. Em outro computador, use o mesmo código pessoal.</span><button class="btn small" type="button" data-favsair="1">Trocar código</button></div>`
    : `<div class="favbar"><span>Seus favoritos ficam só neste computador. Para levar para outros, crie um <b>código pessoal</b> (6 ou mais letras ou números) e use o mesmo código nos outros computadores.</span><span class="favin"><input id="fav-cod" type="text" autocomplete="off" placeholder="Seu código pessoal" aria-label="Código pessoal dos favoritos"><button class="btn small primary" type="button" data-favcod="1">Salvar na nuvem</button></span></div>`;
  let tab = "todos";
  try { tab = localStorage.getItem("guia156-tab") || "todos"; } catch (e) {}

  let db = null, canWrite = false, edits = {};   // edits: id -> doc salvo pela equipe
  let locais = [], oris = [], byId = {};

  const indexLocal = l => norm([l.nome, l.sigla, l.endereco, l.bairro, l.email, l.palavras, l.horario, l.obs,
    CATEGORIAS[l.categoria]?.nome, ...(l.bairros || []), ...(l.responsaveis || []).flat(), ...(l.telefones || []), ...(l.telefones || []).map(digits)].join(" "));
  const indexOri = o => norm([o.titulo, o.resumo, o.obs, o.palavras, TIPOS_ORI[o.tipo]?.nome, ...(o.passos || []), ...(o.documentos || []),
    ...(o.extras || []).flatMap(x => [x.titulo, ...x.itens]), ...(o.onde || []).map(id => byId[id]?.nome)].join(" "));

  const rebuild = () => {
    const merge = (base, kind) => {
      const out = [];
      const seen = new Set();
      base.forEach(b => {
        seen.add(b.id);
        const e = edits[b.id];
        if (e?.oculto) return;
        out.push(e ? { ...e, id: b.id, _editado: true, _base: b } : b);
      });
      Object.values(edits).forEach(e => { if (e.kind === kind && !seen.has(e.id) && !e.oculto) out.push({ ...e, _novo: true }); });
      return out;
    };
    locais = merge(LOCAIS, "local");
    byId = Object.fromEntries(locais.map(l => [l.id, l]));
    oris = merge(ORIENTACOES, "orientacao");
    locais.forEach(l => { l.telefones = l.telefones || []; l._ix = indexLocal(l); });
    oris.forEach(o => o._ix = indexOri(o));
  };

  const matches = (ix, q) => !q || norm(q).split(/\s+/).filter(Boolean).every(t => ix.includes(t) || (digits(t).length >= 3 && ix.includes(digits(t))));

  const hl = (text, q) => {
    text = (text ?? "").toString();
    const t = esc(text);
    if (!q) return t;
    const terms = norm(q).split(/\s+/).filter(w => w.length >= 2);
    if (!terms.length) return t;
    const n = norm(text), marks = [];
    terms.forEach(w => { let i = n.indexOf(w); while (i > -1) { marks.push([i, i + w.length]); i = n.indexOf(w, i + 1); } });
    if (!marks.length) return t;
    marks.sort((a, b) => a[0] - b[0]);
    let out = "", pos = 0;
    for (const [a, b] of marks) { if (a < pos) continue; out += esc(text.slice(pos, a)) + "<mark>" + esc(text.slice(a, b)) + "</mark>"; pos = b; }
    return out + esc(text.slice(pos));
  };

  const enderecoCompleto = l => l.endereco ? [l.endereco, l.bairro].filter(Boolean).join(", ") + ", Osasco - SP" : "";
  const textoLocal = l => [
    l.nome + (l.sigla ? ` (${l.sigla})` : ""),
    l.endereco ? "Endereço: " + enderecoCompleto(l) : "",
    l.telefones.length ? "Telefone: " + l.telefones.join(" / ") : "",
    l.horario ? "Horário: " + l.horario : "",
    l.email ? "E-mail: " + l.email : "",
    l.site ? "Site: " + l.site : "",
  ].filter(Boolean).join("\n");
  const textoOri = o => [o.titulo, o.resumo,
    ...(o.passos?.length ? ["", "O que fazer:", ...o.passos.map((p, i) => `${i + 1}. ${p}`)] : []),
    ...(o.documentos?.length ? ["", "Documentos:", ...o.documentos.map(d => "- " + d)] : []),
    ...(o.extras || []).flatMap(x => ["", x.titulo + ":", ...x.itens.map(d => "- " + d)]),
    ...(o.onde?.length ? ["", "Onde:", ...o.onde.map(id => byId[id] ? "- " + byId[id].nome + (byId[id].telefones[0] ? " – " + byId[id].telefones.join(" / ") : "") : "")] : []),
  ].filter(s => s !== "" || true).join("\n").replace(/\n{3,}/g, "\n\n");

  const phoneHtml = p => `<span class="phone"><button class="num" type="button" data-copynum="${esc(p)}" title="Toque para copiar">${esc(p)}</button><button type="button" data-copy="${esc(p)}" aria-label="Copiar ${esc(p)}">copiar</button></span>`;
  const editBtns = (id, isNovo) => canWrite ? `<button class="btn small" type="button" data-edit="${id}">Corrigir</button>` : "";

  const cardLocal = (l, q) => {
    const fav = favs.includes(l.id);
    const mapa = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(enderecoCompleto(l) || l.nome + " Osasco");
    const bairroHit = q && l.bairros?.find(b => matches(norm(b), q));
    return `<details class="card" data-id="${l.id}">
      <summary>
        <div class="title">${fav ? '<span class="star" aria-label="favorito">★</span>' : ""}${hl(l.nome, q)}${l.sigla ? `<span class="sigla">${esc(l.sigla)}</span>` : ""}${l._novo ? '<span class="badge">novo</span>' : l._editado ? '<span class="badge">corrigido</span>' : ""}${l.conferir ? '<span class="badge warn">confirmar</span>' : ""}</div>
        <div class="quickphone">${esc(l.telefones[0] || "")}</div>
        <div class="sub">${bairroHit ? `Atende ${hl(bairroHit, q)}` : hl([l.endereco, l.bairro].filter(Boolean).join(", "), q)}</div>
      </summary>
      <div class="body">
        ${l.conferir ? `<div class="warn">Confirmar: ${esc(l.conferir)}</div>` : ""}
        ${l.endereco ? `<div class="row"><div class="k">Endereço</div><div class="v">${hl(enderecoCompleto(l), q)}</div></div>` : ""}
        <div class="row"><div class="k">Telefone</div><div class="v">${l.telefones.length ? `<div class="phones">${l.telefones.map(phoneHtml).join("")}</div>` : "<span class='resp'>Não informado</span>"}</div></div>
        ${l.horario ? `<div class="row"><div class="k">Horário</div><div class="v">${esc(l.horario)}</div></div>` : ""}
        ${l.bairros?.length ? `<div class="row"><div class="k">Bairros atendidos</div><div class="v">${l.bairros.map(b => hl(b, q)).join(", ")}${l.bairrosParcial ? ' <span class="resp">(lista parcial)</span>' : ""}</div></div>` : ""}
        ${l.email ? `<div class="row"><div class="k">E-mail</div><div class="v">${esc(l.email)}</div></div>` : ""}
        ${l.site ? `<div class="row"><div class="k">Site</div><div class="v"><a class="link" href="${esc(l.site)}" target="_blank" rel="noopener">Abrir página</a></div></div>` : ""}
        ${l.responsaveis?.length ? `<div class="row"><div class="k">Responsável</div><div class="v resp">${l.responsaveis.map(([c, n]) => `${esc(c)}: ${hl(n, q)}`).join("<br>")}</div></div>` : ""}
        ${l.obs ? `<div class="row"><div class="k">Observação</div><div class="v">${hl(l.obs, q)}</div></div>` : ""}
        <div class="actions">
          <button class="btn primary" type="button" data-copytext="${l.id}">Copiar dados</button>
          ${l.endereco ? `<a class="btn" href="${mapa}" target="_blank" rel="noopener">Ver no mapa</a>` : ""}
          <button class="btn fav" type="button" data-fav="${l.id}" aria-pressed="${fav}">${fav ? "★ Favorito" : "☆ Favoritar"}</button>
          ${editBtns(l.id)}
        </div>
        <div class="fonte">Fonte: ${esc(l._editado || l._novo ? "incluído ou corrigido pela equipe" : (l.fonte || FONTE_PREF))}</div>
      </div>
    </details>`;
  };

  const cardOri = (o, q) => `<details class="card" data-id="${o.id}">
      <summary>
        <div class="title">${hl(o.titulo, q)}${o._novo ? '<span class="badge">novo</span>' : o._editado ? '<span class="badge">corrigido</span>' : ""}</div>
        <div class="sub">${hl(o.resumo || "", q)}</div>
      </summary>
      <div class="body">
        ${o.passos?.length ? `<div class="row"><div class="k">O que orientar</div><div class="v"><ol class="passos">${o.passos.map(p => `<li>${hl(p, q)}</li>`).join("")}</ol></div></div>` : ""}
        ${o.documentos?.length ? `<div class="row"><div class="k">Documentos</div><div class="v"><ul class="docs">${o.documentos.map(d => `<li>${hl(d, q)}</li>`).join("")}</ul></div></div>` : ""}
        ${(o.extras || []).map(x => `<div class="row"><div class="k">${esc(x.titulo)}</div><div class="v"><ul class="docs">${x.itens.map(d => `<li>${hl(d, q)}</li>`).join("")}</ul></div></div>`).join("")}
        ${o.onde?.length ? `<div class="row"><div class="k">Onde</div><div class="v onde">${o.onde.filter(id => byId[id]).map(id => { const l = byId[id]; return `<div class="item"><b>${esc(l.nome)}</b>${l.telefones.length ? `<span class="phones">${l.telefones.map(phoneHtml).join("")}</span>` : ""}</div>`; }).join("")}</div></div>` : ""}
        ${o.obs ? `<div class="warn">${hl(o.obs, q)}</div>` : ""}
        <div class="actions"><button class="btn primary" type="button" data-copyori="${o.id}">Copiar orientação</button>${editBtns(o.id)}</div>
      </div>
    </details>`;

  const TABS = () => {
    const t = [["todos", "Tudo", locais.length + oris.length], ["favoritos", "★ Favoritos", favs.filter(f => byId[f]).length]];
    Object.entries(TIPOS_ORI).forEach(([k, c]) => t.push([k, c.nome, oris.filter(o => o.tipo === k).length]));
    Object.entries(CATEGORIAS).forEach(([k, c]) => t.push([k, c.nome, locais.filter(l => l.categoria === k).length]));
    return t;
  };
  const renderTabs = () => {
    const el = $("#tabs");
    el.innerHTML = TABS().map(([k, n, c]) => `<button class="tab" type="button" data-tab="${k}" aria-pressed="${k === tab}">${n}<span class="n">${c}</span></button>`).join("");
    const act = el.querySelector('[aria-pressed="true"]');
    if (act && el.scrollWidth > el.clientWidth) {
      const target = act.offsetLeft - (el.clientWidth - act.offsetWidth) / 2;
      el.scrollTo({ left: Math.max(0, target) });
    }
    updateFades();
  };
  const updateFades = () => {
    const el = $("#tabs"), w = $("#tabsWrap");
    const over = el.scrollWidth > el.clientWidth + 2;
    w.classList.toggle("fade-l", over && el.scrollLeft > 4);
    w.classList.toggle("fade-r", over && el.scrollLeft + el.clientWidth < el.scrollWidth - 4);
  };
  $("#tabs").addEventListener("scroll", updateFades, { passive: true });
  window.addEventListener("resize", updateFades);

  const render = (anim) => {
    const q = $("#q").value.trim();
    $("#clear").hidden = !q;
    const openIds = [...document.querySelectorAll("#list details[open]")].map(d => d.dataset.id);
    let html = "";

    Object.entries(TIPOS_ORI).forEach(([k, c]) => {
      if (tab !== "todos" && tab !== k) return;
      if (tab === "todos" && !q && k === "encaminhamento") return; // na aba Tudo, sem busca, mostra só agendamentos
      const os = oris.filter(o => o.tipo === k && matches(o._ix, q));
      if (os.length) html += `<section class="group"><h2>${c.nome} <span class="count">${os.length}</span><small>${c.desc}</small></h2>${os.map(o => cardOri(o, q)).join("")}</section>`;
    });

    if (!(tab in TIPOS_ORI)) {
      Object.entries(CATEGORIAS).forEach(([k, c]) => {
        if (tab !== "todos" && tab !== "favoritos" && tab !== k) return;
        const ls = locais.filter(l => l.categoria === k && (tab !== "favoritos" || favs.includes(l.id)) && matches(l._ix, q));
        if (ls.length) html += `<section class="group"><h2>${c.nome} <span class="count">${ls.length}</span><small>${c.desc}</small></h2>${ls.map(l => cardLocal(l, q)).join("")}</section>`;
      });
    }

    if (!html) {
      html = tab === "favoritos" && !q
        ? `<div class="empty"><strong>Nenhum favorito ainda</strong>Abra um cartão e toque em “☆ Favoritar” para deixar os mais usados aqui.</div>`
        : `<div class="empty"><strong>Nada encontrado para “${esc(q)}”</strong>Tente outra palavra, parte do nome do bairro ou só os números do telefone.${canWrite ? " Se faltar algo, toque em “+ Incluir”." : ""}</div>`;
    }
    if (tab === "favoritos" && temNuvem) html = favBar() + html;
    if (!q && tab === "todos") {
      const atalhos = [["190", "Polícia Militar"], ["192", "SAMU"], ["193", "Bombeiros"], ["199", "Defesa Civil"], ["153", "Guarda Civil"], ["188", "CVV"], ["180", "Mulher"], ["100", "Direitos Humanos"]];
      html = `<section class="quick" aria-label="Emergência"><div class="quick-grid">${atalhos.map(([n, l]) => `<button class="qt" type="button" data-copynum="${n}" title="Toque para copiar"><b>${n}</b><span>${l}</span></button>`).join("")}</div><p class="hint">Toque num número para copiar. Dica: digite o bairro do munícipe para ver o CRAS e as UBS da região.</p></section>` + html;
    }
    const list = $("#list");
    list.classList.remove("animar", "suave");
    list.innerHTML = html;
    if (anim) {
      let i = 0;
      list.querySelectorAll(".qt, .group h2, .card").forEach(n => { n.style.setProperty("--i", Math.min(i++, 14)); });
      void list.offsetWidth;
      list.classList.add(anim === "suave" ? "suave" : "animar");
    }

    openIds.forEach(id => { const d = document.querySelector(`#list details[data-id="${CSS.escape(id)}"]`); if (d) d.open = true; });
    if (q) { const cards = document.querySelectorAll("#list details.card"); if (cards.length === 1) cards[0].open = true; }
  };

  // ---------- formulário ----------
  const sheet = (item) => {
    const isOri = item ? !!(item.tipo || item.kind === "orientacao") : false;
    const isBase = item && (LOCAIS.some(l => l.id === item.id) || ORIENTACOES.some(o => o.id === item.id));
    const v = item || {};
    const catOpts = Object.entries(CATEGORIAS).map(([k, c]) => `<option value="${k}" ${v.categoria === k ? "selected" : ""}>${c.nome}</option>`).join("");
    const tipoOpts = Object.entries(TIPOS_ORI).map(([k, c]) => `<option value="${k}" ${v.tipo === k ? "selected" : ""}>${c.nome}</option>`).join("");
    $("#sheetHost").innerHTML = `<div class="sheet" id="sheet"><form id="f" novalidate>
      <h3>${item ? "Corrigir " + esc(v.nome || v.titulo) : "Incluir no guia"}</h3>
      ${item ? "" : `<label>O que é?<select id="f-kind"><option value="local">Local ou telefone (endereço, contato)</option><option value="orientacao">Orientação (documentos, encaminhamento)</option></select></label>`}
      <div id="f-local" ${isOri ? "hidden" : ""}>
        <div style="display:grid;gap:12px">
          <label>Nome<input id="f-nome" value="${esc(v.nome)}"></label>
          <div class="two"><label>Categoria<select id="f-cat">${catOpts}</select></label><label>Sigla <small>(opcional)</small><input id="f-sigla" value="${esc(v.sigla)}"></label></div>
          <div class="two"><label>Endereço<input id="f-end" value="${esc(v.endereco)}"></label><label>Bairro<input id="f-bairro" value="${esc(v.bairro)}"></label></div>
          <label>Telefones <small>(um por linha)</small><textarea id="f-tel">${esc((v.telefones || []).join("\n"))}</textarea></label>
          <div class="two"><label>Horário<input id="f-hor" value="${esc(v.horario)}"></label><label>E-mail<input id="f-email" value="${esc(v.email)}"></label></div>
          <label>Site<input id="f-site" value="${esc(v.site)}"></label>
          <label>Bairros atendidos <small>(um por linha, se for o caso)</small><textarea id="f-bairros">${esc((v.bairros || []).join("\n"))}</textarea></label>
          <label>Observação<textarea id="f-obs">${esc(v.obs)}</textarea></label>
          <label>Palavras para a busca <small>(assuntos que levam a este local)</small><input id="f-pal" value="${esc(v.palavras)}"></label>
          ${v.conferir ? `<label><span><input type="checkbox" id="f-conf-ok" style="width:auto"> Já confirmei: tirar o aviso "${esc(v.conferir)}"</span></label>` : ""}
        </div>
      </div>
      <div id="f-ori" ${isOri ? "" : "hidden"}>
        <div style="display:grid;gap:12px">
          <label>Título<input id="f-tit" value="${esc(v.titulo)}"></label>
          <label>Tipo<select id="f-tipo">${tipoOpts}</select></label>
          <label>Resumo<input id="f-res" value="${esc(v.resumo)}"></label>
          <label>O que orientar <small>(um passo por linha)</small><textarea id="f-passos">${esc((v.passos || []).join("\n"))}</textarea></label>
          <label>Documentos <small>(um por linha)</small><textarea id="f-docs">${esc((v.documentos || []).join("\n"))}</textarea></label>
          <label>Observação<textarea id="f-oobs">${esc(v.obs)}</textarea></label>
          <label>Palavras para a busca<input id="f-opal" value="${esc(v.palavras)}"></label>
        </div>
      </div>
      ${pinSalvo() ? "" : campoPin}
      <div class="err" id="f-err" hidden></div>
      <div class="actions">
        <button class="btn primary" type="submit">Salvar</button>
        <button class="btn" type="button" data-close="1">Cancelar</button>
        ${item ? (item._editado ? `<button class="btn" type="button" data-restore="${item.id}">Voltar ao original</button>` : "") : ""}
        ${item ? `<button class="btn danger" type="button" data-askdel="${item.id}">${isBase ? "Ocultar do guia" : "Excluir"}</button>` : ""}
      </div>
      <div id="f-confirm"></div>
    </form></div>`;
    const kindSel = $("#f-kind");
    if (kindSel) kindSel.addEventListener("change", () => { $("#f-local").hidden = kindSel.value !== "local"; $("#f-ori").hidden = kindSel.value === "local"; });
    $("#f").addEventListener("submit", ev => { ev.preventDefault(); save(item); });
    (isOri ? $("#f-tit") : $("#f-nome")).focus();
  };
  const campoPin = `<label id="f-pinbox">PIN da equipe <small>(só na primeira vez neste computador)</small><input id="f-pin" type="password" autocomplete="off"></label>`;
  const msgErro = (e, acao = "salvar") => {
    if (e?.code === "pin_vazio" || e?.code === "pin_errado") { if (!$("#f-pin")) $("#f-err").insertAdjacentHTML("beforebegin", campoPin); $("#f-pin").focus(); }
    return e?.code === "pin_vazio" ? `Digite o PIN da equipe para ${acao}.`
      : e?.code === "pin_errado" ? "PIN incorreto. Confira com a equipe."
      : e?.code === "bloqueado" ? "Muitas tentativas com PIN errado. Espere 15 minutos e tente de novo."
      : e?.code === "quota_exceeded" ? "O espaço do guia está cheio. Exclua algum item incluído para liberar."
      : `Não deu para ${acao} agora. Confira a conexão e tente de novo.`;
  };
  const closeSheet = () => { $("#sheetHost").innerHTML = ""; };
  const showErr = m => { const e = $("#f-err"); e.textContent = m; e.hidden = false; };
  const slug = s => norm(s).replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "").slice(0, 40) || "item";

  const write = async (id, data) => {
    try { await db.collection("itens").doc(id).set(data); return true; }
    catch (e) {
      if (e?.code === "unavailable") { try { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); await db.collection("itens").doc(id).set(data); return true; } catch (e2) { e = e2; } }
      showErr(msgErro(e));
      return false;
    }
  };

  const save = async (item) => {
    const kind = item ? (item.tipo || item.kind === "orientacao" ? "orientacao" : "local") : $("#f-kind").value;
    let data;
    if (kind === "local") {
      const nome = $("#f-nome").value.trim();
      if (!nome) return showErr("Preencha o nome.");
      data = { kind, nome, categoria: $("#f-cat").value, sigla: $("#f-sigla").value.trim(), endereco: $("#f-end").value.trim(), bairro: $("#f-bairro").value.trim(),
        telefones: lines($("#f-tel").value), horario: $("#f-hor").value.trim(), email: $("#f-email").value.trim(), site: $("#f-site").value.trim(),
        bairros: lines($("#f-bairros").value), obs: $("#f-obs").value.trim(), palavras: $("#f-pal").value.trim() };
      if (item?.responsaveis) data.responsaveis = item.responsaveis.map(([c, n]) => [c, n]);
      if (item?.fonte) data.fonte = item.fonte;
      if (item?.conferir && !$("#f-conf-ok")?.checked) data.conferir = item.conferir;
      if (item?.bairrosParcial) data.bairrosParcial = true;
    } else {
      const titulo = $("#f-tit").value.trim();
      if (!titulo) return showErr("Preencha o título.");
      data = { kind, titulo, tipo: $("#f-tipo").value, resumo: $("#f-res").value.trim(), passos: lines($("#f-passos").value), documentos: lines($("#f-docs").value),
        obs: $("#f-oobs").value.trim(), palavras: $("#f-opal").value.trim() };
      if (item?.extras) data.extras = item.extras.map(x => ({ titulo: x.titulo, itens: [...x.itens] }));
      if (item?.onde) data.onde = [...item.onde];
    }
    Object.keys(data).forEach(k => { if (data[k] === "" || (Array.isArray(data[k]) && !data[k].length)) delete data[k]; });
    data.id = item?.id || (slug(data.nome || data.titulo) + "-" + Date.now().toString(36));
    data.kind = kind;
    data.atualizadoEm = new Date().toISOString();
    if (await write(data.id, data)) { closeSheet(); toast("Salvo no guia"); }
  };

  // ---------- utilidades ----------
  let tt;
  const toast = msg => { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("show"), 1600); };
  const copy = text => {
    const done = () => toast("Copiado");
    const fallback = () => {
      const ta = document.createElement("textarea"); ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy") ? done() : toast("Selecione e copie manualmente"); } catch (e) { toast("Selecione e copie manualmente"); }
      ta.remove();
    };
    if (navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
  };
  const ok = (btn, label) => {
    if (btn._t) clearTimeout(btn._t); else btn._orig = btn.textContent;
    btn.textContent = label; btn.classList.add("ok");
    btn._t = setTimeout(() => { btn.textContent = btn._orig; btn.classList.remove("ok"); btn._t = null; }, 1300);
  };
  const findAny = id => byId[id] || oris.find(o => o.id === id);

  document.addEventListener("click", async e => {
    const b = e.target.closest("button, a");
    if (!b) { if (e.target.id === "sheet") closeSheet(); return; }
    if (b.dataset.tab) { tab = b.dataset.tab; try { localStorage.setItem("guia156-tab", tab); } catch (er) {} renderTabs(); render(true); }
    else if (b.dataset.scroll) { const el = $("#tabs"); el.scrollBy({ left: Number(b.dataset.scroll) * el.clientWidth * 0.7 }); }
    else if (b.dataset.copynum) {
      copy(b.dataset.copynum);
      if (b.classList.contains("qt")) { b.classList.add("ok"); clearTimeout(b._t); b._t = setTimeout(() => b.classList.remove("ok"), 1200); }
      else { const c = b.nextElementSibling; if (c) ok(c, "copiado"); }
    }
    else if (b.dataset.copy) { e.preventDefault(); copy(b.dataset.copy); ok(b, "copiado"); }
    else if (b.dataset.copytext) { copy(textoLocal(byId[b.dataset.copytext])); ok(b, "✓ Copiado"); }
    else if (b.dataset.copyori) { copy(textoOri(oris.find(x => x.id === b.dataset.copyori))); ok(b, "✓ Copiado"); }
    else if (b.dataset.fav) {
      const id = b.dataset.fav;
      favs = favs.includes(id) ? favs.filter(f => f !== id) : [...favs, id];
      saveFavs(); renderTabs(); render();
      const nb = document.querySelector(`[data-fav="${CSS.escape(id)}"]`); if (nb) nb.classList.add("pop");
    }
    else if (b.dataset.favcod) {
      const cod = ($("#fav-cod")?.value || "").trim().toLowerCase();
      if (cod.length < 6) { toast("Use 6 ou mais letras ou números"); $("#fav-cod")?.focus(); return; }
      b.disabled = true;
      try { await sincronizarFavs(cod); ls.set("guia156-codigo", cod); toast("Favoritos salvos na nuvem"); renderTabs(); render(); }
      catch (er) { b.disabled = false; toast("Não deu para salvar agora. Tente de novo."); }
    }
    else if (b.dataset.favsair) { ls.del("guia156-codigo"); render(); }
    else if (b.dataset.edit) { const it = findAny(b.dataset.edit); if (it) sheet(it); }
    else if (b.id === "add") { sheet(null); }
    else if (b.dataset.close) { closeSheet(); }
    else if (b.dataset.askdel) {
      const id = b.dataset.askdel, isBase = LOCAIS.some(l => l.id === id) || ORIENTACOES.some(o => o.id === id);
      $("#f-confirm").innerHTML = `<div class="confirm">${isBase ? "Ocultar este item para todos que usam o guia?" : "Excluir este item de vez?"}
        <button class="btn small danger" type="button" data-del="${id}">Sim, ${isBase ? "ocultar" : "excluir"}</button><button class="btn small" type="button" data-nodel="1">Não</button></div>`;
    }
    else if (b.dataset.nodel) { $("#f-confirm").innerHTML = ""; }
    else if (b.dataset.del) {
      const id = b.dataset.del, isBase = LOCAIS.some(l => l.id === id) || ORIENTACOES.some(o => o.id === id);
      const ok = isBase ? await write(id, { id, oculto: true, atualizadoEm: new Date().toISOString() })
                        : await db.collection("itens").doc(id).delete().then(() => true, er => { showErr(msgErro(er, "excluir")); return false; });
      if (ok) { closeSheet(); toast(isBase ? "Ocultado" : "Excluído"); }
    }
    else if (b.dataset.restore) {
      const id = b.dataset.restore;
      db.collection("itens").doc(id).delete().then(() => { closeSheet(); toast("Voltou ao original"); }, er => showErr(msgErro(er, "restaurar")));
    }
    else if (b.id === "clear") { $("#q").value = ""; lastQ = ""; render(true); $("#q").focus(); }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape" && $("#sheet")) closeSheet(); });
  let lastQ = ""; $("#q").addEventListener("input", () => { const q = $("#q").value.trim(); render(q && !lastQ ? "suave" : false); lastQ = q; });

  rebuild();
  if (!TABS().some(([k]) => k === tab)) tab = "todos";

  // ===== Efeitos inspirados no React Bits (adaptados para JS puro) =====
  const reduceMotion = window.matchMedia?.("(prefers-reduced-motion: reduce)").matches;

  // SpotlightCard: luz que segue o ponteiro (só onde existe mouse)
  if (!reduceMotion && window.matchMedia?.("(hover: hover)").matches) {
    let litEl = null;
    document.addEventListener("pointermove", ev => {
      const el = ev.target.closest?.(".card, .qt");
      if (litEl && litEl !== el) litEl.classList.remove("lit");
      litEl = el;
      if (!el) return;
      const r = el.getBoundingClientRect();
      el.style.setProperty("--mx", (ev.clientX - r.left) + "px");
      el.style.setProperty("--my", (ev.clientY - r.top) + "px");
      el.classList.add("lit");
    }, { passive: true });
    document.addEventListener("pointerleave", () => { litEl?.classList.remove("lit"); litEl = null; });
  }

  // ClickSpark: faíscas saindo do ponto do toque
  const sparkCanvas = $("#sparks");
  if (!reduceMotion && sparkCanvas?.getContext) {
    const ctx = sparkCanvas.getContext("2d");
    let sparks = [], raf = 0;
    const size = () => { const d = window.devicePixelRatio || 1; sparkCanvas.width = innerWidth * d; sparkCanvas.height = innerHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0); };
    size(); window.addEventListener("resize", size);
    const draw = now => {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      const color = getComputedStyle(document.documentElement).getPropertyValue("--spark").trim() || "#0a6b57";
      ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.lineCap = "round";
      sparks = sparks.filter(sp => {
        const t = (now - sp.t0) / 420;
        if (t >= 1) return false;
        const e = 1 - Math.pow(1 - t, 3);
        const dist = e * 26, len = 9 * (1 - e);
        const x1 = sp.x + Math.cos(sp.a) * dist, y1 = sp.y + Math.sin(sp.a) * dist;
        ctx.globalAlpha = 1 - t;
        ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 + Math.cos(sp.a) * len, y1 + Math.sin(sp.a) * len); ctx.stroke();
        return true;
      });
      ctx.globalAlpha = 1;
      raf = sparks.length ? requestAnimationFrame(draw) : 0;
    };
    document.addEventListener("pointerdown", ev => {
      if (!ev.target.closest?.("button, a, summary, .tab")) return;
      const t0 = performance.now();
      for (let i = 0; i < 8; i++) sparks.push({ x: ev.clientX, y: ev.clientY, a: (Math.PI * 2 * i) / 8, t0 });
      if (!raf) raf = requestAnimationFrame(draw);
    }, { passive: true });
  }

  // CountUp: contadores das abas e seções sobem do zero ao abrir o guia
  const countUp = () => {
    if (reduceMotion) return;
    document.querySelectorAll(".tab .n, .group h2 .count").forEach(el => {
      const end = parseInt(el.textContent, 10);
      if (!end) return;
      const t0 = performance.now(), dur = 700 + Math.min(end, 120) * 4;
      const step = now => {
        const t = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - t, 3);
        el.textContent = Math.round(end * e);
        if (t < 1) requestAnimationFrame(step);
      };
      el.textContent = "0";
      requestAnimationFrame(step);
    });
  };

  renderTabs(); render(true); countUp();

  // ---------- banco compartilhado (inclusões e correções) ----------
  const comPin = async (fn, body) => {
    const pin = ($("#f-pin")?.value || "").trim() || pinSalvo();
    if (!pin) { const e = new Error("pin"); e.code = "pin_vazio"; throw e; }
    const res = await rpc(fn, { p_pin: pin, ...body });
    if (res === "ok") { ls.set("guia156-pin", pin); return; }
    if (res === "pin") ls.del("guia156-pin");
    const e = new Error(res); e.code = res === "pin" ? "pin_errado" : res === "bloqueado" ? "bloqueado" : res === "cheio" ? "quota_exceeded" : "invalido"; throw e;
  };
  if (temNuvem) {
    let ouvinte = null;
    const carregar = async () => {
      try { const rows = await api("itens?select=id,data"); if (ouvinte) ouvinte({ docs: rows.map(r => ({ id: r.id, data: () => r.data })) }); } catch (e) { /* sem rede: segue com o que já tem */ }
    };
    db = { collection: () => ({
      doc: id => ({
        set: async data => { await comPin("salvar_item", { p_id: id, p_data: data }); await carregar(); },
        delete: async () => { await comPin("excluir_item", { p_id: id }); await carregar(); }
      }),
      onSnapshot: cb => { ouvinte = cb; carregar(); }
    }) };
    canWrite = true; $("#add").hidden = false; render();
    db.collection("itens").onSnapshot(snap => {
      const next = {};
      snap.docs.forEach(d => { const x = d.data(); if (x) next[d.id] = { ...x, id: d.id }; });
      edits = next;
      rebuild(); renderTabs(); render();
    });
    setInterval(() => { if (!document.hidden) carregar(); }, 60000);
    document.addEventListener("visibilitychange", () => { if (!document.hidden) carregar(); });
    if (codigoFav()) sincronizarFavs(codigoFav()).then(() => { renderTabs(); render(); }, () => {});
  }
})();
</script>
